<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>기초 탄탄 수학 퀴즈</title>
    <meta
      name="description"
      content="문제 번호·점수 표시, 정답 공개 및 해설, 문제 편집 기능을 갖춘 단일 HTML 초등 수학 퀴즈 웹앱"
    />
    <meta property="og:title" content="기초 탄탄 수학 퀴즈" />
    <meta
      property="og:description"
      content="문제 번호·점수 표시, 정답 공개 및 해설, 문제 편집 기능을 갖춘 단일 HTML 초등 수학 퀴즈 웹앱"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root {
        --bg-canvas: #f8fafc;
        --surface-card: #ffffff;
        --surface-subtle: #f1f5f9;
        --border-subtle: #e2e8f0;
        --border-strong: #cbd5e1;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --accent-primary: #1d4ed8;
        --accent-primary-hover: #1e40af;
        --accent-soft: #eff6ff;
        --accent-border: #bfdbfe;
        --correct-text: #065f46;
        --correct-bg: #ecfdf5;
        --correct-border: #6ee7b7;
        --wrong-text: #991b1b;
        --wrong-bg: #fef2f2;
        --wrong-border: #fca5a5;
        --warn-text: #92400e;
        --warn-bg: #fffbeb;
        --warn-border: #fde68a;
        --font-sans: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        font-family: var(--font-sans);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
      }

      /* Top Bar Contract */
      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 1080px;
        margin: 0 auto;
        padding: 16px 24px;
        border-bottom: 1px solid var(--border-subtle);
        background-color: var(--surface-card);
      }

      .brand-title {
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: -0.02em;
        text-decoration: none;
        white-space: nowrap;
      }

      .top-nav {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 0.9rem;
        color: var(--text-secondary);
      }

      .top-nav span {
        white-space: nowrap;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* Main Layout */
      .app-shell {
        max-width: 780px;
        margin: 28px auto 48px;
        padding: 0 20px;
      }

      /* Status Bar: Question Number & Score */
      .status-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        padding: 14px 20px;
        margin-bottom: 16px;
        background-color: var(--surface-card);
        border: 1px solid var(--border-subtle);
        border-radius: 14px;
      }

      .status-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.98rem;
        font-weight: 600;
        color: var(--text-primary);
      }

      .status-sep {
        color: var(--text-muted);
        font-weight: 400;
      }

      .score-display {
        font-size: 1.05rem;
        font-weight: 700;
        color: var(--accent-primary);
        font-variant-numeric: tabular-nums;
      }

      /* Progress Bar */
      .progress-track {
        width: 100%;
        height: 6px;
        background-color: var(--surface-subtle);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 20px;
      }

      .progress-fill {
        height: 100%;
        background-color: var(--accent-primary);
        transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
        transform-origin: left center;
      }

      /* Main Card */
      .quiz-card {
        background-color: var(--surface-card);
        border: 1px solid var(--border-subtle);
        border-radius: 16px;
        padding: 28px 24px;
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.03);
      }

      .question-kicker {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--accent-primary);
        margin-bottom: 8px;
      }

      .question-title {
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--text-primary);
        line-height: 1.45;
        margin-bottom: 24px;
        word-break: keep-all;
        overflow-wrap: break-word;
      }

      /* Options Grid */
      .options-list {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        margin-bottom: 22px;
      }

      .option-btn {
        display: flex;
        align-items: center;
        width: 100%;
        min-height: 52px;
        padding: 12px 16px;
        border: 1px solid var(--border-strong);
        border-radius: 12px;
        background-color: var(--surface-card);
        color: var(--text-primary);
        font-family: inherit;
        font-size: 1.02rem;
        font-weight: 500;
        text-align: left;
        cursor: pointer;
        transition: opacity 150ms cubic-bezier(0.16, 1, 0.3, 1),
          transform 150ms cubic-bezier(0.16, 1, 0.3, 1),
          background-color 150ms ease,
          border-color 150ms ease;
      }

      .option-btn:hover:not(:disabled) {
        background-color: var(--accent-soft);
        border-color: var(--accent-primary);
      }

      .option-btn:focus-visible {
        outline: 2px solid var(--accent-primary);
        outline-offset: 2px;
      }

      .option-num {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background-color: var(--surface-subtle);
        color: var(--text-secondary);
        font-size: 0.9rem;
        font-weight: 700;
        margin-right: 12px;
        flex-shrink: 0;
      }

      .option-text {
        flex: 1;
        word-break: break-word;
      }

      .option-state-tag {
        margin-left: 12px;
        font-size: 0.85rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .option-btn.selected-option {
        background-color: var(--accent-soft);
        border-color: var(--accent-primary);
        font-weight: 600;
      }

      .option-btn.selected-option .option-num {
        background-color: var(--accent-primary);
        color: #ffffff;
      }

      .option-btn.correct-option {
        background-color: var(--correct-bg);
        border-color: var(--correct-border);
        color: var(--correct-text);
        font-weight: 600;
      }

      .option-btn.correct-option .option-num {
        background-color: var(--correct-text);
        color: #ffffff;
      }

      .option-btn.wrong-option {
        background-color: var(--wrong-bg);
        border-color: var(--wrong-border);
        color: var(--wrong-text);
      }

      .option-btn.wrong-option .option-num {
        background-color: var(--wrong-text);
        color: #ffffff;
      }

      /* Explanation Panel */
      .explanation-box {
        margin-top: 8px;
        margin-bottom: 24px;
        padding: 18px 20px;
        border-radius: 12px;
        border: 1px solid var(--border-subtle);
        background-color: var(--surface-subtle);
      }

      .explanation-box.is-correct {
        background-color: var(--correct-bg);
        border-color: var(--correct-border);
      }

      .explanation-box.is-wrong {
        background-color: var(--wrong-bg);
        border-color: var(--wrong-border);
      }

      .feedback-headline {
        font-size: 1.02rem;
        font-weight: 700;
        margin-bottom: 6px;
      }

      .explanation-box.is-correct .feedback-headline {
        color: var(--correct-text);
      }

      .explanation-box.is-wrong .feedback-headline {
        color: var(--wrong-text);
      }

      .answer-summary {
        font-size: 0.94rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 6px;
      }

      .explanation-text {
        font-size: 0.95rem;
        color: var(--text-secondary);
        line-height: 1.6;
      }

      /* Controls & Buttons */
      .quiz-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        padding-top: 16px;
        border-top: 1px solid var(--border-subtle);
      }

      .controls-left,
      .controls-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 10px 18px;
        border-radius: 10px;
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid transparent;
        white-space: nowrap;
        transition: opacity 150ms ease, transform 150ms ease, background-color 150ms ease;
      }

      .btn:focus-visible {
        outline: 2px solid var(--accent-primary);
        outline-offset: 2px;
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-primary {
        background-color: var(--accent-primary);
        color: #ffffff;
      }

      .btn-primary:hover:not(:disabled) {
        background-color: var(--accent-primary-hover);
      }

      .btn-secondary {
        background-color: var(--surface-card);
        color: var(--text-primary);
        border-color: var(--border-strong);
      }

      .btn-secondary:hover:not(:disabled) {
        background-color: var(--surface-subtle);
      }

      .btn-ghost {
        background-color: transparent;
        color: var(--text-secondary);
        border-color: var(--border-subtle);
      }

      .btn-ghost:hover:not(:disabled) {
        background-color: var(--surface-subtle);
        color: var(--text-primary);
      }

      /* Final Score Screen */
      .final-score-card {
        background-color: var(--surface-card);
        border: 1px solid var(--border-subtle);
        border-radius: 16px;
        padding: 36px 28px;
        text-align: center;
      }

      .final-kicker {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 8px;
      }

      .final-heading {
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 16px;
      }

      .final-score-number {
        font-size: 2.6rem;
        font-weight: 700;
        color: var(--accent-primary);
        margin-bottom: 8px;
        font-variant-numeric: tabular-nums;
      }

      .final-score-detail {
        font-size: 0.98rem;
        color: var(--text-secondary);
        margin-bottom: 24px;
      }

      .review-list {
        text-align: left;
        border-top: 1px solid var(--border-subtle);
        padding-top: 20px;
        margin-bottom: 28px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .review-item {
        padding: 14px 16px;
        border-radius: 10px;
        background-color: var(--surface-subtle);
        border: 1px solid var(--border-subtle);
      }

      .review-item-title {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 4px;
      }

      .review-item-desc {
        font-size: 0.88rem;
        color: var(--text-secondary);
      }

      /* Editor Modal & Tablet Scroll Support */
      .editor-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background-color: rgba(15, 23, 42, 0.55);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 20px 16px 40px;
      }

      .editor-modal {
        width: 100%;
        max-width: 720px;
        max-height: calc(100vh - 40px);
        max-height: calc(100dvh - 40px);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        background-color: var(--surface-card);
        border: 1px solid var(--border-subtle);
        border-radius: 16px;
        padding: 24px 24px 32px;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.18);
      }

      .editor-header {
        margin-bottom: 16px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border-subtle);
      }

      .editor-title {
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 6px;
      }

      .editor-reload-notice {
        font-size: 0.92rem;
        font-weight: 600;
        color: var(--warn-text);
        background-color: var(--warn-bg);
        border: 1px solid var(--warn-border);
        border-radius: 8px;
        padding: 10px 14px;
      }

      .editor-error-banner {
        margin: 14px 0;
        padding: 12px 16px;
        border-radius: 10px;
        background-color: var(--wrong-bg);
        border: 1px solid var(--wrong-border);
        color: var(--wrong-text);
        font-size: 0.94rem;
        font-weight: 600;
      }

      .editor-questions-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 24px;
      }

      .editor-question-block {
        padding: 18px;
        border-radius: 12px;
        background-color: var(--surface-subtle);
        border: 1px solid var(--border-subtle);
      }

      .editor-block-heading {
        font-size: 1.02rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 14px;
      }

      .form-group {
        margin-bottom: 12px;
      }

      .form-group:last-child {
        margin-bottom: 0;
      }

      .form-label {
        display: block;
        font-size: 0.88rem;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 6px;
      }

      .form-input,
      .form-textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        background-color: var(--surface-card);
        color: var(--text-primary);
        font-family: inherit;
        font-size: 0.95rem;
      }

      .form-textarea {
        min-height: 72px;
        resize: vertical;
      }

      .form-input:focus,
      .form-textarea:focus {
        outline: 2px solid var(--accent-primary);
        border-color: var(--accent-primary);
      }

      .form-input.input-invalid,
      .form-textarea.input-invalid {
        border-color: #dc2626;
        background-color: #fff5f5;
      }

      .options-edit-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 12px;
      }

      .editor-footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;
        padding-top: 16px;
        border-top: 1px solid var(--border-subtle);
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 640px) {
        .top-bar {
          padding: 12px 16px;
        }
        .top-nav {
          display: none;
        }
        .options-edit-grid {
          grid-template-columns: 1fr;
        }
        .quiz-card {
          padding: 20px 16px;
        }
        .editor-modal {
          padding: 18px 16px 28px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Top Bar (3-Zone Contract) -->
    <header class="top-bar">
      <a href="#quiz" class="brand-title" onclick="return false;">기초 탄탄 수학 퀴즈</a>
      <nav class="top-nav" aria-label="퀴즈 안내">
        <span>분수와 길이 단위</span>
        <span>·</span>
        <span>정답 공개 시 100점</span>
      </nav>
      <div class="top-actions">
        <button type="button" id="open-editor-btn" class="btn btn-secondary">
          문제 편집
        </button>
      </div>
    </header>

    <main class="app-shell">
      <!-- Status Bar: Question Number & Score -->
      <section class="status-bar" aria-label="진행 상태 및 점수">
        <div class="status-meta">
          <span id="question-number-badge">문제 1번</span>
          <span class="status-sep" aria-hidden="true">·</span>
          <span id="question-progress-text">1 / 3</span>
        </div>
        <div class="score-display" id="score-display">점수: 0점</div>
      </section>

      <div class="progress-track" aria-hidden="true">
        <div id="progress-fill" class="progress-fill" style="transform: scaleX(0.3333);"></div>
      </div>

      <!-- Quiz Stage View -->
      <section id="quiz-view" class="quiz-card" aria-live="polite">
        <div id="question-kicker" class="question-kicker">문제 1번</div>
        <h1 id="question-text" class="question-title"></h1>

        <div id="options-container" class="options-list" role="group" aria-label="보기 목록"></div>

        <!-- Explanation & Result Box -->
        <div id="explanation-box" class="explanation-box hidden">
          <div id="feedback-headline" class="feedback-headline"></div>
          <div id="answer-summary" class="answer-summary"></div>
          <p id="explanation-text" class="explanation-text"></p>
        </div>

        <!-- Quiz Action Controls -->
        <div class="quiz-controls">
          <div class="controls-left">
            <button type="button" id="reveal-answer-btn" class="btn btn-secondary">
              정답 공개
            </button>
          </div>
          <div class="controls-right">
            <button type="button" id="next-step-btn" class="btn btn-primary">
              다음 문제
            </button>
          </div>
        </div>
      </section>

      <!-- Final Score View -->
      <section id="final-view" class="final-score-card hidden" aria-live="polite">
        <div class="final-kicker">모든 문제를 풀었습니다</div>
        <h2 class="final-heading">최종 점수</h2>
        <div id="final-score-value" class="final-score-number">0점</div>
        <p id="final-score-summary" class="final-score-detail"></p>

        <div id="final-review-list" class="review-list"></div>

        <button type="button" id="restart-quiz-btn" class="btn btn-primary">
          다시 시작
        </button>
      </section>
    </main>

    <!-- Question Editor Modal (태블릿 스크롤 지원) -->
    <div
      id="editor-overlay"
      class="editor-overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="editor-modal-title"
    >
      <div id="editor-modal" class="editor-modal">
        <div class="editor-header">
          <h2 id="editor-modal-title" class="editor-title">문제 편집</h2>
          <p class="editor-reload-notice">새로고침하면 기본 문제로 돌아갑니다</p>
        </div>

        <div id="editor-error-top" class="editor-error-banner hidden" role="alert"></div>

        <form id="editor-form" novalidate>
          <div id="editor-questions-list" class="editor-questions-container"></div>

          <div id="editor-error-bottom" class="editor-error-banner hidden" role="alert"></div>

          <div class="editor-footer">
            <button type="button" id="cancel-editor-btn" class="btn btn-secondary">
              취소
            </button>
            <button type="submit" id="apply-editor-btn" class="btn btn-primary">
              적용
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      (function () {
        // 기본 퀴즈 데이터 (현재 퀴즈 유지 + 요청된 두 문제 추가)
        var DEFAULT_QUESTIONS = [
          {
            question: "1시간은 몇 분일까요?",
            options: ["30", "60", "100", "120"],
            answer: 2,
            explanation:
              "시간의 단위에서 1시간은 60분과 같습니다. 시계의 긴바늘(분침)이 한 바퀴 도는 데 걸리는 시간은 60분입니다."
          },
          {
            question: "1/2과 크기가 같은 분수는?",
            options: ["1/3", "2/4", "2/3", "3/4"],
            answer: 2,
            explanation:
              "1/2의 분자와 분모에 0이 아닌 같은 수 2를 곱하면 (1×2)/(2×2) = 2/4가 되므로 1/2과 2/4는 크기가 같은 분수입니다."
          },
          {
            question: "1m는 몇 cm일까요?",
            options: ["10", "50", "100", "1000"],
            answer: 3,
            explanation:
              "길이의 단위에서 1m(미터)는 1cm(센티미터)가 100개 모인 길이이므로 100cm입니다. 따라서 정답은 100입니다."
          }
        ];

        function cloneQuestions(list) {
          return list.map(function (item) {
            return {
              question: String(item.question),
              options: item.options.map(function (opt) {
                return String(opt);
              }),
              answer: Number(item.answer),
              explanation: String(item.explanation)
            };
          });
        }

        // 앱 상태
        var questions = cloneQuestions(DEFAULT_QUESTIONS);
        var currentIndex = 0;
        var score = 0;
        var showingFinalScore = false;

        // 각 문제별 진행 상태 저장 (정답 중복 가산 방지 및 취소 시 복원용)
        var questionStates = [];

        function initQuestionStates() {
          questionStates = questions.map(function () {
            return {
              selectedOption: null, // 1~4
              isRevealed: false,
              earnedScore: 0
            };
          });
        }

        initQuestionStates();

        // DOM 요소 참조
        var questionNumberBadge = document.getElementById("question-number-badge");
        var questionProgressText = document.getElementById("question-progress-text");
        var scoreDisplay = document.getElementById("score-display");
        var progressFill = document.getElementById("progress-fill");

        var quizView = document.getElementById("quiz-view");
        var finalView = document.getElementById("final-view");

        var questionKicker = document.getElementById("question-kicker");
        var questionText = document.getElementById("question-text");
        var optionsContainer = document.getElementById("options-container");

        var explanationBox = document.getElementById("explanation-box");
        var feedbackHeadline = document.getElementById("feedback-headline");
        var answerSummary = document.getElementById("answer-summary");
        var explanationText = document.getElementById("explanation-text");

        var revealAnswerBtn = document.getElementById("reveal-answer-btn");
        var nextStepBtn = document.getElementById("next-step-btn");
        var restartQuizBtn = document.getElementById("restart-quiz-btn");

        var finalScoreValue = document.getElementById("final-score-value");
        var finalScoreSummary = document.getElementById("final-score-summary");
        var finalReviewList = document.getElementById("final-review-list");

        var openEditorBtn = document.getElementById("open-editor-btn");
        var editorOverlay = document.getElementById("editor-overlay");
        var editorForm = document.getElementById("editor-form");
        var editorQuestionsList = document.getElementById("editor-questions-list");
        var editorErrorTop = document.getElementById("editor-error-top");
        var editorErrorBottom = document.getElementById("editor-error-bottom");
        var cancelEditorBtn = document.getElementById("cancel-editor-btn");

        // 현재 문제 화면 렌더링
        function renderQuiz() {
          var total = questions.length;
          var displayNum = currentIndex + 1;

          questionNumberBadge.textContent = "문제 " + displayNum + "번";
          questionProgressText.textContent = displayNum + " / " + total;
          scoreDisplay.textContent = "점수: " + score + "점";

          var ratio = total > 0 ? displayNum / total : 1;
          progressFill.style.transform = "scaleX(" + ratio + ")";

          if (showingFinalScore) {
            quizView.classList.add("hidden");
            finalView.classList.remove("hidden");
            renderFinalScore();
            return;
          }

          finalView.classList.add("hidden");
          quizView.classList.remove("hidden");

          var currentQ = questions[currentIndex];
          var currentState = questionStates[currentIndex];

          questionKicker.textContent = "문제 " + displayNum + "번";
          // textContent를 사용하여 큰따옴표("), 작은따옴표('), 유니코드 따옴표(“ ”)를 그대로 안전하게 표시
          questionText.textContent = currentQ.question;

          // 보기 4개 렌더링
          optionsContainer.innerHTML = "";
          for (var i = 0; i < 4; i++) {
            (function (optionIdx) {
              var optionNum = optionIdx + 1;
              var btn = document.createElement("button");
              btn.type = "button";
              btn.className = "option-btn";

              var numSpan = document.createElement("span");
              numSpan.className = "option-num";
              numSpan.textContent = String(optionNum);

              var textSpan = document.createElement("span");
              textSpan.className = "option-text";
              textSpan.textContent = currentQ.options[optionIdx];

              var stateTag = document.createElement("span");
              stateTag.className = "option-state-tag";

              if (currentState.isRevealed) {
                if (optionNum === currentQ.answer) {
                  btn.classList.add("correct-option");
                  stateTag.textContent = "✓ 정답";
                } else if (currentState.selectedOption === optionNum) {
                  btn.classList.add("wrong-option");
                  stateTag.textContent = "✕ 선택";
                }
              } else if (currentState.selectedOption === optionNum) {
                btn.classList.add("selected-option");
                stateTag.textContent = "선택됨";
              }

              btn.appendChild(numSpan);
              btn.appendChild(textSpan);
              btn.appendChild(stateTag);

              btn.addEventListener("click", function () {
                handleOptionClick(optionNum);
              });

              optionsContainer.appendChild(btn);
            })(i);
          }

          // 해설 및 정답 공개 상태 렌더링
          if (currentState.isRevealed) {
            explanationBox.classList.remove("hidden", "is-correct", "is-wrong");
            var isCorrect = currentState.selectedOption === currentQ.answer;
            if (isCorrect) {
              explanationBox.classList.add("is-correct");
              feedbackHeadline.textContent = "✓ 정답입니다! (+100점)";
            } else {
              explanationBox.classList.add("is-wrong");
              feedbackHeadline.textContent = "✕ 오답입니다. (+0점)";
            }

            var correctOptionText = currentQ.options[currentQ.answer - 1];
            answerSummary.textContent =
              "정답: " + currentQ.answer + "번 (" + correctOptionText + ")";
            explanationText.textContent = "해설: " + currentQ.explanation;
            revealAnswerBtn.textContent = "정답 공개 완료";
          } else {
            explanationBox.classList.add("hidden");
            explanationBox.classList.remove("is-correct", "is-wrong");
            revealAnswerBtn.textContent = "정답 공개";
          }

          // 다음 문제 / 최종 점수 버튼 텍스트 설정
          if (currentIndex < total - 1) {
            nextStepBtn.textContent = "다음 문제";
          } else {
            nextStepBtn.textContent = "다음 문제 (최종 점수)";
          }
        }

        // 보기 클릭 처리: 아직 정답이 공개되지 않았다면 선택 즉시 채점 및 정답·해설 공개 (1회만 100점 부여)
        function handleOptionClick(optionNum) {
          var currentState = questionStates[currentIndex];
          if (currentState.isRevealed) {
            // 이미 정답이 공개된 문제는 점수가 중복 합산되지 않도록 유지
            return;
          }
          currentState.selectedOption = optionNum;
          revealCurrentAnswer();
        }

        // 정답 공개 및 채점 (문제당 정답은 한 번만 100점, 오답은 0점)
        function revealCurrentAnswer() {
          var currentQ = questions[currentIndex];
          var currentState = questionStates[currentIndex];

          if (currentState.isRevealed) {
            // 이미 정답 공개가 완료된 경우 점수를 다시 더하지 않음
            renderQuiz();
            return;
          }

          currentState.isRevealed = true;
          if (currentState.selectedOption === currentQ.answer) {
            currentState.earnedScore = 100;
            score += 100;
          } else {
            currentState.earnedScore = 0;
          }

          renderQuiz();
        }

        // 최종 점수 화면 렌더링
        function renderFinalScore() {
          var total = questions.length;
          var maxScore = total * 100;
          var correctCount = questionStates.filter(function (st) {
            return st.earnedScore === 100;
          }).length;

          finalScoreValue.textContent = score + "점";
          finalScoreSummary.textContent =
            "총 " +
            total +
            "문제 중 " +
            correctCount +
            "문제 정답 · " +
            maxScore +
            "점 만점";

          finalReviewList.innerHTML = "";
          questions.forEach(function (q, idx) {
            var st = questionStates[idx];
            var item = document.createElement("div");
            item.className = "review-item";

            var title = document.createElement("div");
            title.className = "review-item-title";
            var statusLabel = st.earnedScore === 100 ? "정답 (+100점)" : "오답 (0점)";
            title.textContent =
              "문제 " + (idx + 1) + "번: " + q.question + " — " + statusLabel;

            var desc = document.createElement("div");
            desc.className = "review-item-desc";
            desc.textContent =
              "정답: " +
              q.answer +
              "번 (" +
              q.options[q.answer - 1] +
              ") | 해설: " +
              q.explanation;

            item.appendChild(title);
            item.appendChild(desc);
            finalReviewList.appendChild(item);
          });
        }

        // 다시 시작 (문제 1번 · 0점으로 초기화)
        function restartQuiz() {
          currentIndex = 0;
          score = 0;
          showingFinalScore = false;
          initQuestionStates();
          renderQuiz();
        }

        // 이벤트 바인딩: 정답 공개, 다음 문제, 다시 시작
        revealAnswerBtn.addEventListener("click", function () {
          revealCurrentAnswer();
        });

        nextStepBtn.addEventListener("click", function () {
          if (currentIndex < questions.length - 1) {
            currentIndex += 1;
            renderQuiz();
          } else {
            showingFinalScore = true;
            renderQuiz();
          }
        });

        restartQuizBtn.addEventListener("click", function () {
          restartQuiz();
        });

        // 문제 편집창 열기
        function openEditor() {
          hideEditorError();
          editorQuestionsList.innerHTML = "";

          questions.forEach(function (q, qIdx) {
            var block = document.createElement("div");
            block.className = "editor-question-block";

            var heading = document.createElement("h3");
            heading.className = "editor-block-heading";
            heading.textContent = "문제 " + (qIdx + 1) + "번 편집";
            block.appendChild(heading);

            // 질문 입력
            var qGroup = document.createElement("div");
            qGroup.className = "form-group";
            var qLabel = document.createElement("label");
            qLabel.className = "form-label";
            qLabel.setAttribute("for", "edit-question-" + qIdx);
            qLabel.textContent = "질문";
            var qInput = document.createElement("input");
            qInput.type = "text";
            qInput.id = "edit-question-" + qIdx;
            qInput.className = "form-input";
            qInput.setAttribute("data-field", "question");
            qInput.setAttribute("data-q-index", String(qIdx));
            // DOM value 프로퍼티를 사용하여 따옴표가 있는 질문도 손실/깨짐 없이 그대로 설정
            qInput.value = q.question;
            qGroup.appendChild(qLabel);
            qGroup.appendChild(qInput);
            block.appendChild(qGroup);

            // 보기 1~4 입력
            var optGrid = document.createElement("div");
            optGrid.className = "options-edit-grid";
            for (var oIdx = 0; oIdx < 4; oIdx++) {
              var oGroup = document.createElement("div");
              oGroup.className = "form-group";
              var oLabel = document.createElement("label");
              oLabel.className = "form-label";
              oLabel.setAttribute("for", "edit-opt-" + qIdx + "-" + oIdx);
              oLabel.textContent = "보기 " + (oIdx + 1);
              var oInput = document.createElement("input");
              oInput.type = "text";
              oInput.id = "edit-opt-" + qIdx + "-" + oIdx;
              oInput.className = "form-input";
              oInput.setAttribute("data-field", "option");
              oInput.setAttribute("data-q-index", String(qIdx));
              oInput.setAttribute("data-opt-index", String(oIdx));
              oInput.value = q.options[oIdx];
              oGroup.appendChild(oLabel);
              oGroup.appendChild(oInput);
              optGrid.appendChild(oGroup);
            }
            block.appendChild(optGrid);

            // 정답 번호 (1~4) 입력
            var ansGroup = document.createElement("div");
            ansGroup.className = "form-group";
            var ansLabel = document.createElement("label");
            ansLabel.className = "form-label";
            ansLabel.setAttribute("for", "edit-answer-" + qIdx);
            ansLabel.textContent = "정답 번호 (1~4)";
            var ansInput = document.createElement("input");
            ansInput.type = "number";
            ansInput.min = "1";
            ansInput.max = "4";
            ansInput.step = "1";
            ansInput.id = "edit-answer-" + qIdx;
            ansInput.className = "form-input";
            ansInput.setAttribute("data-field", "answer");
            ansInput.setAttribute("data-q-index", String(qIdx));
            ansInput.value = String(q.answer);
            ansGroup.appendChild(ansLabel);
            ansGroup.appendChild(ansInput);
            block.appendChild(ansGroup);

            // 해설 입력
            var expGroup = document.createElement("div");
            expGroup.className = "form-group";
            var expLabel = document.createElement("label");
            expLabel.className = "form-label";
            expLabel.setAttribute("for", "edit-explanation-" + qIdx);
            expLabel.textContent = "해설";
            var expInput = document.createElement("textarea");
            expInput.id = "edit-explanation-" + qIdx;
            expInput.className = "form-textarea";
            expInput.setAttribute("data-field", "explanation");
            expInput.setAttribute("data-q-index", String(qIdx));
            expInput.value = q.explanation;
            expGroup.appendChild(expLabel);
            expGroup.appendChild(expInput);
            block.appendChild(expGroup);

            editorQuestionsList.appendChild(block);
          });

          editorOverlay.classList.remove("hidden");
        }

        // 편집창 닫기 (취소 시 수정 전 문제와 진행 상태 그대로 유지)
        function closeEditor() {
          hideEditorError();
          editorOverlay.classList.add("hidden");
        }

        function showEditorError(message, invalidElement) {
          editorErrorTop.textContent = message;
          editorErrorBottom.textContent = message;
          editorErrorTop.classList.remove("hidden");
          editorErrorBottom.classList.remove("hidden");

          if (invalidElement) {
            invalidElement.classList.add("input-invalid");
            invalidElement.focus();
          }
        }

        function hideEditorError() {
          editorErrorTop.textContent = "";
          editorErrorBottom.textContent = "";
          editorErrorTop.classList.add("hidden");
          editorErrorBottom.classList.add("hidden");

          var invalidInputs = editorForm.querySelectorAll(".input-invalid");
          for (var i = 0; i < invalidInputs.length; i++) {
            invalidInputs[i].classList.remove("input-invalid");
          }
        }

        // 편집 내용 검증 및 적용
        function handleApplyEditor(event) {
          event.preventDefault();
          hideEditorError();

          var updatedQuestions = [];

          for (var qIdx = 0; qIdx < questions.length; qIdx++) {
            var qNum = qIdx + 1;
            var qInput = document.getElementById("edit-question-" + qIdx);
            var ansInput = document.getElementById("edit-answer-" + qIdx);
            var expInput = document.getElementById("edit-explanation-" + qIdx);

            var rawQuestion = qInput.value.trim();
            if (!rawQuestion) {
              showEditorError(
                "문제 " + qNum + "번의 질문이 비어 있습니다. 빈칸을 입력해 주세요.",
                qInput
              );
              return;
            }

            var newOptions = [];
            for (var oIdx = 0; oIdx < 4; oIdx++) {
              var oInput = document.getElementById("edit-opt-" + qIdx + "-" + oIdx);
              var rawOpt = oInput.value.trim();
              if (!rawOpt) {
                showEditorError(
                  "문제 " +
                    qNum +
                    "번의 보기 " +
                    (oIdx + 1) +
                    "번이 비어 있습니다. 빈 보기를 모두 입력해 주세요.",
                  oInput
                );
                return;
              }
              newOptions.push(rawOpt);
            }

            var rawAns = ansInput.value.trim();
            var parsedAns = Number(rawAns);
            if (
              rawAns === "" ||
              !Number.isInteger(parsedAns) ||
              parsedAns < 1 ||
              parsedAns > 4
            ) {
              showEditorError(
                "문제 " +
                  qNum +
                  "번의 정답 번호가 잘못되었습니다. 정답 번호는 1~4 사이의 숫자로 입력해 주세요.",
                ansInput
              );
              return;
            }

            var rawExp = expInput.value.trim();
            if (!rawExp) {
              showEditorError(
                "문제 " + qNum + "번의 해설이 비어 있습니다. 빈칸을 입력해 주세요.",
                expInput
              );
              return;
            }

            updatedQuestions.push({
              question: rawQuestion,
              options: newOptions,
              answer: parsedAns,
              explanation: rawExp
            });
          }

          // 검증 통과 시 새 문제 내용으로 반영하고 문제 1번 · 0점부터 다시 시작
          questions = updatedQuestions;
          closeEditor();
          restartQuiz();
        }

        openEditorBtn.addEventListener("click", function () {
          openEditor();
        });

        cancelEditorBtn.addEventListener("click", function () {
          closeEditor();
        });

        editorForm.addEventListener("submit", handleApplyEditor);

        // 초기 렌더링
        renderQuiz();
      })();
    </script>
  </body>
</html>
